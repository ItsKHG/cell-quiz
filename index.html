<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cell Organelles Quiz</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:22px;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eaf4ff,#f4edff);color:#1f2937}
.wrap{max-width:820px;margin:25px auto;background:white;padding:28px;border-radius:18px;box-shadow:0 10px 30px #1e293b20}
h1{text-align:center;color:#293b8f;margin-top:0}.sub{text-align:center;color:#64748b;margin-bottom:28px}
.bar{height:10px;background:#e5e7eb;border-radius:20px;overflow:hidden;margin:16px 0 24px}.fill{height:100%;width:0;background:#5865d9}
.card{border:1px solid #e5e7eb;border-radius:14px;padding:20px}.card h2{font-size:19px;line-height:1.4}
.opt{display:block;width:100%;text-align:left;padding:13px;margin:9px 0;border:2px solid #dbe2ef;border-radius:10px;background:white;font-size:15px;cursor:pointer}
.opt:hover:not(:disabled){border-color:#6875df;background:#f5f6ff}.opt:disabled{cursor:default;opacity:1}.correct{border-color:#16a34a!important;background:#ecfdf3!important}.wrong{border-color:#dc2626!important;background:#fef2f2!important}
.feedback{font-weight:bold;margin-top:14px}.explain{font-weight:normal;color:#475569;margin-top:6px;line-height:1.45}
.controls{text-align:center;margin:22px}.btn{background:#4f5bd5;color:white;border:0;border-radius:10px;padding:13px 22px;font-size:16px;font-weight:bold;cursor:pointer;margin:5px}.btn:disabled{background:#a5a9c8;cursor:not-allowed}
#result{display:none;text-align:center;padding:22px}#score{font-size:30px;color:#293b8f;font-weight:bold}.hint{text-align:center;color:#64748b;font-size:14px}
</style></head><body><main class="wrap"><h1>🔬 Cell Organelles Quiz</h1><p class="sub">Test what you know about the parts of a cell!</p>
<section id="quiz"><div id="count">Question 1 of 10</div><div class="bar"><div class="fill" id="fill"></div></div><div id="area"></div>
<div class="controls"><button class="btn" id="next" disabled>Next Question</button></div><p class="hint">Choose one answer for each question. You'll get feedback after every choice.</p></section>
<section id="result"><h2>Quiz complete!</h2><p id="score"></p><p id="message"></p><button class="btn" onclick="restart()">Try Again</button><button class="btn" onclick="review()">Review Answers</button></section></main>
<script>
const qs=[["Which organelle acts as the control center of the cell and houses DNA?", ["Mitochondria", "Nucleus", "Cytoplasm", "Golgi apparatus"], 1, "The nucleus stores most of the cell's DNA and helps control cell activities."], ["What is the primary function of the nucleolus?", ["Producing ribosomes", "Breaking down waste", "Synthesizing lipids", "Storing water"], 0, "The nucleolus makes the components used to build ribosomes."], ["What role does the cytoplasm play?", ["It makes ATP energy", "It holds cell contents and is where many chemical reactions happen", "It builds cell walls", "It controls what enters the cell"], 1, "Cytoplasm is the jelly-like material that holds cell structures and supports many reactions."], ["What does the cell membrane do?", ["Provides rigid support only in plants", "Controls what enters and leaves the cell", "Performs photosynthesis", "Stores genetic instructions"], 1, "The cell membrane controls which substances enter and leave."], ["Which structure gives plant cells extra strength, shape, and protection?", ["Cell wall", "Nucleolus", "Mitochondrion", "Vacuole"], 0, "The cell wall is a strong outer layer that supports and protects plant cells."], ["What is the main function of chloroplasts?", ["Digest worn-out cell parts", "Capture light energy to make glucose through photosynthesis", "Package proteins", "Synthesize lipids"], 1, "Chloroplasts capture light energy for photosynthesis."], ["What is the main job of vacuoles, especially large central vacuoles in plants?", ["Make ribosomes", "Store water and nutrients and help maintain turgor pressure", "Generate ATP", "Copy DNA"], 1, "The central vacuole stores water; its pressure helps keep a plant cell firm."], ["Why are mitochondria called the 'powerhouse' of the cell?", ["They control all cell activities", "They perform cellular respiration to produce ATP energy", "They sort and ship proteins", "They build the cell membrane"], 1, "Mitochondria make ATP, a usable form of energy, during cellular respiration."], ["What is the primary function of the endoplasmic reticulum (ER)?", ["Store starch", "Help transport materials and make proteins or lipids", "Capture sunlight", "Destroy bacteria"], 1, "Rough ER helps make and move proteins; smooth ER makes lipids."], ["What does the Golgi apparatus do?", ["Modifies, sorts, and packages proteins and lipids for transport", "Holds the cell's main DNA", "Creates the cell wall", "Generates heat"], 0, "The Golgi apparatus modifies, sorts, and packages materials to be sent where needed."]];let i=0,score=0,answers=Array(qs.length).fill(null),reviewMode=false;
const area=document.getElementById('area'),next=document.getElementById('next');
function render(){let q=qs[i];document.getElementById('count').textContent=`Question ${i+1} of ${qs.length}`;document.getElementById('fill').style.width=`${i/qs.length*100}%`;area.innerHTML='';
let card=document.createElement('div');card.className='card';let h=document.createElement('h2');h.textContent=`${i+1}. ${q[0]}`;card.appendChild(h);
q[1].forEach((v,n)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+n)+') '+v;b.disabled=answers[i]!==null||reviewMode;
if(answers[i]!==null){if(n===q[2])b.classList.add('correct');if(n===answers[i]&&answers[i]!==q[2])b.classList.add('wrong');}
b.onclick=()=>choose(n);card.appendChild(b);});
if(answers[i]!==null||reviewMode){let f=document.createElement('div');f.className='feedback';f.style.color=answers[i]===q[2]?'#15803d':'#b91c1c';f.textContent=reviewMode?'Correct answer: '+String.fromCharCode(65+q[2])+'.':(answers[i]===q[2]?'Correct! ✓':'Not quite. The correct answer is '+String.fromCharCode(65+q[2])+'.');
let e=document.createElement('div');e.className='explain';e.textContent=q[3];f.appendChild(e);card.appendChild(f);}
area.appendChild(card);next.disabled=answers[i]===null&&!reviewMode;next.textContent=i===qs.length-1?(reviewMode?'Back to Results':'Finish Quiz'):'Next Question';}
function choose(n){if(answers[i]!==null)return;answers[i]=n;if(n===qs[i][2])score++;render();}
next.onclick=()=>{if(i<qs.length-1){i++;render();}else if(reviewMode){document.getElementById('quiz').style.display='none';document.getElementById('result').style.display='block';}else showResult();};
function showResult(){document.getElementById('quiz').style.display='none';document.getElementById('result').style.display='block';document.getElementById('score').textContent=`You got ${score} out of ${qs.length}!`;document.getElementById('message').textContent=score===10?'Perfect score! You know your cell organelles really well!':score>=8?'Awesome work!':score>=6?'Good effort! Review the explanations and try again.':'Keep practicing! Review the answers and try again.';}
function review(){i=0;reviewMode=true;document.getElementById('result').style.display='none';document.getElementById('quiz').style.display='block';render();}
function restart(){i=0;score=0;answers=Array(qs.length).fill(null);reviewMode=false;document.getElementById('result').style.display='none';document.getElementById('quiz').style.display='block';render();}
render();
</script></body></html>
